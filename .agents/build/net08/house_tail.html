<div class="nav"><button type="button" data-prev aria-label="שקופית קודמת">הקודם</button><button type="button" data-next aria-label="שקופית הבאה">הבא</button><div class="progress" aria-hidden="true"><span></span></div><div class="counter"></div><button type="button" data-notes>הערות</button></div><div class="notes-panel" hidden></div></main></div></div><script>
(() => {
  const root = document.querySelector('.deck-root');
  const stage = root.querySelector('.stage');
  const slides = [...root.querySelectorAll('.slide')];
  const prev = root.querySelector('[data-prev]');
  const next = root.querySelector('[data-next]');
  const counter = root.querySelector('.counter');
  const progress = root.querySelector('.progress span');
  const notesButton = root.querySelector('[data-notes]');
  const notesPanel = root.querySelector('.notes-panel');
  let index = 0;
  function scaleStage(){
    const s = Math.min((innerWidth-20)/1280,(innerHeight-20)/720);
    stage.style.transform = 'scale('+Math.max(.2,s)+')';
  }
  function show(i){
    index = Math.max(0,Math.min(slides.length-1,i));
    slides.forEach((s,n)=>{const active=n===index;s.classList.toggle('active',active);s.setAttribute('aria-hidden',String(!active));});
    prev.disabled=index===0; next.disabled=index===slides.length-1;
    counter.textContent=(index+1)+' / '+slides.length;
    progress.style.width=((index+1)/slides.length*100)+'%';
    notesPanel.hidden=true;
  }
  prev.addEventListener('click',()=>show(index-1));
  next.addEventListener('click',()=>show(index+1));
  notesButton.addEventListener('click',()=>{
    const note=slides[index].querySelector('.speaker-note');
    notesPanel.innerHTML='<strong>הערות למעביר</strong>'+(note?note.innerHTML:'אין הערות לשקופית זו.');
    notesPanel.hidden=!notesPanel.hidden;
  });
  addEventListener('keydown',(e)=>{
    if(['ArrowRight','PageDown',' '].includes(e.key)){e.preventDefault();show(index+1)}
    else if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();show(index-1)}
    else if(e.key==='Home')show(0);else if(e.key==='End')show(slides.length-1);
    else if(e.key.toLowerCase()==='n')notesButton.click();
    else if(e.key.toLowerCase()==='a'){root.classList.toggle('motion-on');var mb=root.querySelector('.motion-badge');if(mb)mb.hidden=root.classList.contains('motion-on');root.querySelectorAll('svg').forEach(function(v){if(v.pauseAnimations){root.classList.contains('motion-on')?v.unpauseAnimations():v.pauseAnimations();}});}else if(e.key.toLowerCase()==='f'){if(!document.fullscreenElement)document.documentElement.requestFullscreen?.();else document.exitFullscreen?.()}
  });

  addEventListener('resize',scaleStage);scaleStage();show(0);
})();
</script>
