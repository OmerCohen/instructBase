<style>
/* editor.css — the editor's own UI. Colours follow the house tokens of the decks. */
:root {
  --bg: #070c15; --panel: #0b1220; --panel2: #101b30; --card: rgba(255,255,255,.045);
  --border: rgba(255,255,255,.11); --border2: rgba(255,255,255,.2);
  --cyan: #22d3ee; --amber: #fbbf24; --red: #fb7185; --green: #4ade80;
  --ink: #f1f5f9; --muted: #a7b7c9; --dim: #8ba0b5;
  --top: 52px;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--ink); font: 14px/1.45 "Segoe UI", Arial, sans-serif; direction: rtl; -webkit-font-smoothing: antialiased; overflow: hidden; }
button, input, select, textarea { font: inherit; color: inherit; }
code, .code, pre { font-family: Consolas, "Courier New", monospace; }
code { background: rgba(255,255,255,.07); border-radius: 4px; padding: 0 4px; direction: ltr; unicode-bidi: isolate; }
h1, h2, h3 { margin: 0; }
.muted { color: var(--muted); }
.small { font-size: 12.5px; }
.grow { flex: 1; }
.sep { width: 1px; align-self: stretch; background: var(--border); margin: 0 4px; }
[hidden] { display: none !important; }

/* buttons */
button { cursor: pointer; border: 1px solid var(--border); background: rgba(255,255,255,.06); border-radius: 8px; padding: 6px 12px; white-space: nowrap; }
button:hover:not(:disabled) { background: rgba(34,211,238,.13); border-color: rgba(34,211,238,.45); }
button:disabled { opacity: .35; cursor: default; }
button.primary { background: rgba(34,211,238,.18); border-color: rgba(34,211,238,.6); color: #e6fbff; font-weight: 700; }
button.primary:hover:not(:disabled) { background: rgba(34,211,238,.28); }
button.big { font-size: 16px; padding: 11px 20px; border-radius: 11px; }
button.small { padding: 4px 9px; font-size: 13px; }
button.icon { padding: 2px 7px; font-size: 13px; line-height: 1.3; min-width: 26px; }
button.danger:hover:not(:disabled) { background: rgba(251,113,133,.15); border-color: rgba(251,113,133,.55); }
button.link { background: none; border: 0; color: var(--cyan); padding: 0 2px; text-decoration: underline; }
button.file { text-align: right; direction: ltr; font-family: Consolas, monospace; font-size: 12.5px; background: rgba(255,255,255,.035); }
button.tb { min-width: 34px; padding: 4px 9px; font-weight: 700; }
input[type=text], input[type=search], select, textarea { background: #050a12; border: 1px solid var(--border2); border-radius: 8px; padding: 6px 9px; outline: none; min-width: 0; }
input:focus, select:focus, textarea:focus, .rich:focus { border-color: var(--cyan); box-shadow: 0 0 0 3px rgba(34,211,238,.15); }

/* top bar */
.topbar { height: var(--top); display: flex; align-items: center; gap: 12px; padding: 0 14px; background: #050910; border-bottom: 1px solid var(--border); }
.brand { display: flex; flex-direction: column; line-height: 1.15; flex: 0 0 auto; }
.brand b { font-size: 15px; }
.folder { font-size: 12px; color: var(--cyan); direction: ltr; text-align: right; max-width: 220px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tabs { flex: 1; display: flex; gap: 4px; overflow-x: auto; align-items: center; min-width: 0; scrollbar-width: thin; }
.tab { display: inline-flex; align-items: center; border: 1px solid var(--border); border-radius: 9px; background: rgba(255,255,255,.03); flex: 0 0 auto; }
button.tab { padding: 6px 12px; }
.tab.on { background: rgba(34,211,238,.14); border-color: rgba(34,211,238,.55); }
.tab .tab-main { border: 0; background: none; padding: 5px 10px; display: inline-flex; align-items: center; gap: 6px; direction: ltr; font-size: 13px; }
.tab .tab-x { border: 0; background: none; padding: 3px 8px; color: var(--dim); }
.tab .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--amber); display: inline-block; }
.kind { font-size: 10.5px; font-weight: 800; border-radius: 5px; padding: 1px 5px; direction: rtl; }
.k-deck { background: rgba(34,211,238,.18); color: var(--cyan); }
.k-guide { background: rgba(251,191,36,.16); color: var(--amber); }
.k-index { background: rgba(74,222,128,.16); color: var(--green); }
.k-raw { background: rgba(255,255,255,.1); color: var(--muted); }
.top-actions { display: flex; gap: 6px; align-items: center; flex: 0 0 auto; }
.opt { font-size: 12px; color: var(--muted); display: inline-flex; align-items: center; gap: 4px; }
.banner { background: rgba(251,191,36,.12); border-bottom: 1px solid rgba(251,191,36,.4); padding: 6px 14px; color: #fde68a; }

main { height: calc(100vh - var(--top)); overflow: auto; }
body:has(.banner:not([hidden])) main { height: calc(100vh - var(--top) - 38px); }

/* welcome + home */
.welcome { max-width: 760px; margin: 60px auto; padding: 0 24px; }
.welcome h1 { font-size: 34px; margin-bottom: 10px; }
.welcome .lead { font-size: 17px; color: var(--muted); margin: 0 0 26px; }
.welcome-actions { display: flex; gap: 12px; margin-bottom: 24px; flex-wrap: wrap; }
.note { border: 1px solid var(--border); border-radius: 12px; background: var(--panel); padding: 12px 16px; margin: 0 0 12px; color: var(--muted); line-height: 1.6; }
.note.warn { border-color: rgba(251,191,36,.45); color: #fde68a; }
.home { padding: 26px 30px 60px; }
.home-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 20px; margin-bottom: 18px; flex-wrap: wrap; }
.home-head h1 { font-size: 26px; }
.home-head p { margin: 4px 0 0; }
.home-actions { display: flex; gap: 8px; flex-wrap: wrap; }
.track { margin: 26px 0 0; }
.track > h2 { font-size: 19px; color: var(--cyan); margin-bottom: 10px; display: flex; gap: 10px; align-items: center; }
.track > h2 .cnt { font-size: 12px; color: var(--dim); border: 1px solid var(--border); border-radius: 99px; padding: 0 8px; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(310px, 1fr)); gap: 12px; }
.card { border: 1px solid var(--border); background: var(--card); border-radius: 13px; padding: 13px 15px; display: flex; flex-direction: column; gap: 8px; }
.card-top { display: flex; gap: 10px; align-items: center; }
.card-top .num { flex: 0 0 34px; height: 34px; border-radius: 9px; display: grid; place-items: center; background: rgba(34,211,238,.11); border: 1px solid rgba(34,211,238,.35); color: var(--cyan); font-weight: 800; font-size: 13px; }
.card-top b { font-size: 15.5px; }
.card .desc { margin: 0; color: var(--muted); font-size: 13px; line-height: 1.45; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.chips { display: flex; gap: 5px; flex-wrap: wrap; }
.chip { font-size: 11.5px; border-radius: 99px; padding: 1px 8px; border: 1px solid var(--border); color: var(--muted); white-space: nowrap; }
.chip.ok { border-color: rgba(74,222,128,.45); color: var(--green); }
.chip.bad { border-color: rgba(251,113,133,.5); color: var(--red); }
.chip.warn { border-color: rgba(251,191,36,.5); color: var(--amber); }
.chip.dim { color: var(--dim); }
.acts { display: flex; gap: 6px; flex-wrap: wrap; margin-top: auto; }
.warnbox { border: 1px solid rgba(251,191,36,.4); border-radius: 13px; padding: 14px 18px; background: rgba(251,191,36,.05); }
.warnbox h2 { color: var(--amber) !important; }
.warnbox h3 { font-size: 14px; margin: 8px 0 4px; }
.warnbox ul { margin: 0; padding-right: 18px; }
.filelist { display: flex; flex-wrap: wrap; gap: 6px; }
.filelist.tall { flex-direction: column; flex-wrap: nowrap; max-height: 55vh; overflow: auto; margin-top: 10px; }
.empty { color: var(--muted); }

/* unit editor */
main.editor { overflow: hidden; }
.ed-grid { display: grid; grid-template-columns: 270px minmax(0, 1fr) 360px; height: 100%; }
.rail { border-left: 1px solid var(--border); display: flex; flex-direction: column; min-height: 0; background: #060b13; }
.rail-head { display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-bottom: 1px solid var(--border); }
.rail-head b { font-size: 14px; }
.rail-head button { margin-right: auto; }
.units { list-style: none; margin: 0; padding: 6px; overflow: auto; flex: 1; }
.units li { position: relative; border: 1px solid transparent; border-radius: 9px; margin-bottom: 3px; }
.units li:hover { background: rgba(255,255,255,.035); }
.units li.on { background: rgba(34,211,238,.1); border-color: rgba(34,211,238,.45); }
.units li.drop { border-top: 2px solid var(--amber); }
.units li.dragging { opacity: .4; }
.units li.title-unit .u-n { background: rgba(251,191,36,.15); color: var(--amber); }
.u-main { display: flex; align-items: flex-start; gap: 8px; width: 100%; border: 0; background: none; padding: 7px 8px; text-align: right; white-space: normal; }
.u-main:hover { background: none !important; border: 0 !important; }
.u-n { flex: 0 0 26px; height: 22px; border-radius: 6px; display: grid; place-items: center; background: rgba(255,255,255,.07); font-size: 12px; font-weight: 700; color: var(--muted); }
.u-t { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.u-t b { font-size: 12.8px; font-weight: 600; line-height: 1.3; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.u-t small { color: var(--dim); font-size: 11.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.u-flags { display: flex; flex-direction: column; gap: 2px; }
.flag { font-style: normal; font-size: 10px; border-radius: 4px; padding: 0 4px; white-space: nowrap; }
.flag.live { background: rgba(74,222,128,.14); color: var(--green); }
.flag.warn { background: rgba(251,191,36,.14); color: var(--amber); }
.u-acts { display: none; gap: 3px; padding: 0 8px 7px 0; justify-content: flex-end; }
.units li:hover .u-acts, .units li.on .u-acts { display: flex; }
.center { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.toolbar { display: flex; align-items: center; gap: 6px; padding: 7px 10px; border-bottom: 1px solid var(--border); background: #070d17; flex-wrap: wrap; }
.switch { display: inline-flex; align-items: center; gap: 5px; font-size: 13px; color: var(--muted); cursor: pointer; }
.frame-wrap { position: relative; flex: 1; min-height: 0; background: #000; }
.frame-wrap.guide, .frame-wrap.page { background: #e9eef3; }
.frame-wrap iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: transparent; }
.hint { margin: 0; padding: 6px 12px; font-size: 12px; color: var(--dim); border-top: 1px solid var(--border); }
.props { border-right: 1px solid var(--border); overflow: auto; background: #060b13; padding: 10px 12px 40px; }
.props-title { font-size: 13px; color: var(--dim); font-weight: 600; margin: 2px 0 10px; }
.field { margin-bottom: 10px; display: flex; flex-direction: column; gap: 4px; }
.field > label { font-size: 12px; color: var(--muted); font-weight: 600; }
.field input[type=text] { width: 100%; }
.rich { min-height: 32px; border: 1px solid var(--border2); background: #050a12; border-radius: 8px; padding: 6px 9px; outline: none; line-height: 1.5; overflow-wrap: anywhere; }
.rich.tall { min-height: 110px; max-height: 300px; overflow: auto; font-size: 13px; }
.rich:empty::before { content: attr(data-placeholder); color: var(--dim); }
.rich .ltr, .index-form .rich .ltr { direction: ltr; unicode-bidi: isolate; background: rgba(34,211,238,.1); border-radius: 3px; }
.rich strong, .rich b { color: #fff; }
.panel { border: 1px solid var(--border); border-radius: 10px; margin: 10px 0; background: rgba(255,255,255,.02); }
.panel > summary { cursor: pointer; padding: 8px 11px; font-weight: 600; font-size: 13px; color: var(--muted); }
.panel[open] > summary { border-bottom: 1px solid var(--border); margin-bottom: 8px; }
.panel > :not(summary) { margin-right: 10px; margin-left: 10px; }
.panel > :last-child { margin-bottom: 10px; }
.row { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin: 6px 0; }
textarea.code { width: 100%; font-size: 12px; line-height: 1.45; direction: ltr; text-align: left; resize: vertical; white-space: pre-wrap; tab-size: 2; }
textarea.code.full { flex: 1; min-height: 0; resize: none; border-radius: 0; border: 0; border-top: 1px solid var(--border); white-space: pre; }
.lint { list-style: none; padding: 0; margin: 0 10px 10px; font-size: 12.5px; }
.lint li { padding: 4px 0; border-bottom: 1px dashed var(--border); }
.lint li.error { color: var(--red); }
.lint li.warn { color: #fde68a; }
.lint li.info { color: var(--muted); }
.lint li.ok { color: var(--green); }
.warnline { margin: 0; padding: 6px 12px; background: rgba(251,191,36,.08); color: #fde68a; font-size: 12.5px; }

/* source editor + index editor */
.src-grid, .idx-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); height: 100%; }
.src-pane, .idx-pane { display: flex; flex-direction: column; min-height: 0; border-left: 1px solid var(--border); }
.idx-pane { overflow: auto; }
.index-form { padding: 10px 14px 60px; }
.idx-track { border: 1px solid var(--border); border-radius: 12px; padding: 10px 12px; margin: 12px 0; background: rgba(255,255,255,.02); }
.idx-track-head { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
.idx-track-head .track-name { font-size: 16px; font-weight: 700; color: var(--cyan); width: 220px; }
.idx-lesson { border: 1px solid var(--border); border-radius: 10px; padding: 8px 10px; margin: 8px 0; background: var(--panel); display: flex; flex-direction: column; gap: 6px; }
.idx-lesson-head { display: flex; gap: 6px; align-items: center; }
.idx-lesson-head .num-in { width: 52px; text-align: center; direction: ltr; }
.idx-lesson-head .title-in { flex: 1; font-weight: 700; }
.desc-in { font-size: 13px; color: var(--muted); }
.links { display: flex; flex-direction: column; gap: 4px; }
.link-row { display: flex; gap: 6px; align-items: center; }
.link-row .lt { width: 110px; }
.link-row .lh { flex: 1; font-family: Consolas, monospace; font-size: 12px; }
.link-row.missing .lh { border-color: rgba(251,113,133,.6); }

/* menus, dialogs, toasts */
.menu { position: fixed; z-index: 50; background: #0c1626; border: 1px solid var(--border2); border-radius: 10px; padding: 5px; display: flex; flex-direction: column; min-width: 210px; max-height: 70vh; overflow: auto; box-shadow: 0 18px 50px rgba(0,0,0,.6); }
.menu button { border: 0; background: none; text-align: right; border-radius: 6px; }
.menu hr { border: 0; border-top: 1px solid var(--border); margin: 4px 0; width: 100%; }
.dlg { background: #0b1322; color: var(--ink); border: 1px solid var(--border2); border-radius: 14px; padding: 0; width: min(720px, 94vw); max-height: 90vh; box-shadow: 0 30px 90px rgba(0,0,0,.7); }
.dlg::backdrop { background: rgba(0,0,0,.6); }
.dlg form { padding: 18px 22px; display: flex; flex-direction: column; gap: 12px; }
.dlg h2 { font-size: 19px; }
.dlg-actions { display: flex; gap: 8px; justify-content: flex-start; border-top: 1px solid var(--border); padding-top: 12px; }
.grid-form { display: flex; flex-direction: column; gap: 10px; }
.grid-form label { display: flex; flex-direction: column; gap: 4px; font-size: 12.5px; color: var(--muted); font-weight: 600; }
.grid-form label.check { flex-direction: row; align-items: center; gap: 6px; font-weight: 400; color: var(--ink); }
.grid-form .two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.grid-form fieldset { border: 1px solid var(--border); border-radius: 10px; padding: 8px 12px; }
.grid-form legend { color: var(--muted); font-size: 12.5px; padding: 0 4px; }
.radios { display: flex; flex-direction: column; gap: 6px; }
.radios label { flex-direction: row !important; align-items: center; gap: 6px; color: var(--ink) !important; font-weight: 400 !important; }
.paths { margin: 4px 0 0; font-size: 12px; color: var(--cyan); background: #050a12; border-radius: 8px; padding: 8px 10px; white-space: pre-wrap; }
.err { color: var(--red); margin: 0; min-height: 1em; font-size: 13px; }
.zip-list { display: flex; flex-direction: column; gap: 5px; max-height: 45vh; overflow: auto; border: 1px solid var(--border); border-radius: 10px; padding: 8px 10px; }
.zip-list label { display: flex; align-items: center; gap: 6px; }
progress { width: 100%; }
.toasts { position: fixed; bottom: 16px; left: 16px; z-index: 100; display: flex; flex-direction: column; gap: 8px; max-width: 460px; }
.toast { background: #0f1b2e; border: 1px solid var(--border2); border-right: 4px solid var(--cyan); border-radius: 10px; padding: 10px 14px; box-shadow: 0 14px 40px rgba(0,0,0,.55); transition: opacity .4s, transform .4s; line-height: 1.5; }
.toast.ok { border-right-color: var(--green); }
.toast.warn { border-right-color: var(--amber); }
.toast.error { border-right-color: var(--red); }
.toast.out { opacity: 0; transform: translateY(8px); }

/* ---------- slide edit modal (slide-editor.js) ---------- */
.se-dlg { width: 97vw; height: 95vh; max-width: none; max-height: none; padding: 0; border: 1px solid var(--border2); border-radius: 14px; background: #070c15; color: var(--ink); display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 30px 90px rgba(0,0,0,.75); }
.se-dlg::backdrop { background: rgba(0,0,0,.7); }
.se-dlg:not([open]) { display: none; }
.se-top { display: flex; align-items: center; gap: 6px; padding: 8px 12px; border-bottom: 1px solid var(--border); background: #050910; flex-wrap: wrap; }
.se-title { font-size: 14px; margin-left: 6px; white-space: nowrap; }
.se-texttools { display: inline-flex; align-items: center; gap: 4px; opacity: .45; }
.se-texttools.on { opacity: 1; }
.swatch { width: 22px; height: 22px; min-width: 22px; padding: 0; border-radius: 6px; border: 2px solid rgba(255,255,255,.25); }
.se-warn { background: rgba(251,113,133,.16); border: 1px solid rgba(251,113,133,.6); color: #fecdd3; border-radius: 99px; padding: 2px 10px; font-size: 12.5px; font-weight: 700; }
.se-main { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) 220px; }
.se-left { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.se-canvas { position: relative; flex: 1; min-height: 0; background: #04070d; }
.se-canvas.guide { background: #e9eef3; }
.se-frame { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; display: block; }
.se-overlay { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
.se-hover { position: absolute; border: 1.5px dashed rgba(34,211,238,.6); border-radius: 6px; }
.se-sel { position: absolute; border: 2px solid var(--cyan); border-radius: 7px; box-shadow: 0 0 0 4px rgba(34,211,238,.12); }
.se-sel.editing { border-color: var(--amber); box-shadow: 0 0 0 4px rgba(251,191,36,.14); }
.se-sel-name { position: absolute; top: -21px; right: -2px; font-size: 11px; font-weight: 700; background: var(--cyan); color: #04212a; border-radius: 5px 5px 0 0; padding: 1px 7px; white-space: nowrap; }
.se-sel.editing .se-sel-name { background: var(--amber); color: #2a1d04; }
.se-bar { position: absolute; display: flex; gap: 3px; pointer-events: auto; background: #0c1626; border: 1px solid var(--border2); border-radius: 9px; padding: 3px; box-shadow: 0 8px 24px rgba(0,0,0,.5); z-index: 3; }
.se-overflow { position: absolute; border: 2px solid var(--red); background: rgba(251,113,133,.12); border-radius: 4px; }
.se-code { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; border-radius: 0; resize: none; white-space: pre-wrap; font-size: 12.5px; background: #050a12; }
.se-hint { margin: 0; padding: 6px 12px; font-size: 12px; color: var(--dim); border-top: 1px solid var(--border); }
.se-side { border-right: 1px solid var(--border); overflow: auto; padding: 6px 10px 24px; background: #060b13; font-size: 13px; }
.se-side h4 { margin: 10px 0 5px; font-size: 12px; color: var(--muted); }
.se-palette { display: flex; flex-direction: column; gap: 3px; }
button.tile { text-align: right; padding: 3px 9px; font-size: 12.5px; line-height: 1.35; background: rgba(34,211,238,.06); border-radius: 6px; }
.se-side .row { gap: 4px; }
.se-side button.small { padding: 3px 7px; font-size: 12px; }
.se-side .rich.tall { min-height: 90px; font-size: 12.5px; }
.se-crumbs { display: flex; flex-wrap: wrap; gap: 3px; align-items: center; margin-bottom: 6px; }
button.crumb { padding: 2px 7px; font-size: 12px; border-radius: 6px; }
button.crumb.on, button.small.on { background: rgba(34,211,238,.2); border-color: var(--cyan); color: #e6fbff; }
.se-selpanel .field { margin-top: 6px; }
.se-selpanel input[type=text] { width: 100%; }
</style>
</head>

r-note\">מה מספרים בפתיחה, וסדר השיעור לפי שקופיות.\u003c/aside>\u003c/section>\u003csection class=\"slide\" aria-hidden=\"true\">\u003cdiv class=\"slide-mark\" aria-hidden=\"true\">\u003cspan class=\"crest crest-sm\">\u003c/span>\u003cspan>תקשוב 5059\u003c/span>\u003c/div>\u003cdiv class=\"eyebrow\">\u003cspan class=\"num\">01\u003c/span>נושא\u003c/div>\u003ch1 class=\"title\">כותרת השקופית\u003c/h1>\u003cp class=\"subtitle\">משפט אחד שמסביר מה רואים בשקופית.\u003c/p>\u003cdiv class=\"body\">\u003cul class=\"checklist\">\u003cli>נקודה ראשונה\u003c/li>\u003cli>נקודה שנייה\u003c/li>\u003cli>נקודה שלישית\u003c/li>\u003c/ul>\u003c/div>\u003caside class=\"speaker-note\">הערות למדריך: מה מסבירים ומה שואלים.\u003c/aside>\u003cdiv class=\"footer\">\u003cspan>שיעור 0 · שם השיעור\u003c/span>\u003cspan class=\"ltr\">02 / 03\u003c/span>\u003c/div>\u003c/section>\u003csection class=\"slide\" aria-hidden=\"true\">\u003cdiv class=\"slide-mark\" aria-hidden=\"true\">\u003cspan class=\"crest crest-sm\">\u003c/span>\u003cspan>תקשוב 5059\u003c/span>\u003c/div>\u003cdiv class=\"eyebrow\">\u003cspan class=\"num\">02\u003c/span>סיכום\u003c/div>\u003ch1 class=\"title\">סיכום\u003c/h1>\u003cp class=\"subtitle\">משפט אחד שמסכם את השיעור.\u003c/p>\u003cdiv class=\"body\">\u003cdiv class=\"steps\">\u003cdiv class=\"step\">\u003cstrong>שלב\u003c/strong>\u003cspan>מה עושים\u003c/span>\u003c/div>\u003cdiv class=\"step\">\u003cstrong>שלב\u003c/strong>\u003cspan>מה עושים\u003c/span>\u003c/div>\u003cdiv class=\"step\">\u003cstrong>שלב\u003c/strong>\u003cspan>מה עושים\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003caside class=\"speaker-note\">מה החניכים לוקחים מהשיעור.\u003c/aside>\u003cdiv class=\"footer\">\u003cspan>שיעור 0 · שם השיעור\u003c/span>\u003cspan class=\"ltr\">03 / 03\u003c/span>\u003c/div>\u003c/section>\u003cdiv class=\"nav\">\u003cbutton type=\"button\" data-prev aria-label=\"שקופית קודמת\">הקודם\u003c/button>\u003cbutton type=\"button\" data-next aria-label=\"שקופית הבאה\">הבא\u003c/button>\u003cdiv class=\"progress\" aria-hidden=\"true\">\u003cspan>\u003c/span>\u003c/div>\u003cdiv class=\"counter\">\u003c/div>\u003cbutton type=\"button\" data-notes>הערות\u003c/button>\u003c/div>\u003cdiv class=\"notes-panel\" hidden>\u003c/div>\u003c/main>\u003c/div>\u003c/div>\u003cscript>\n(() => {\n  const root = document.querySelector('.deck-root');\n  const stage = root.querySelector('.stage');\n  const slides = [...root.querySelectorAll('.slide')];\n  const prev = root.querySelector('[data-prev]');\n  const next = root.querySelector('[data-next]');\n  const counter = root.querySelector('.counter');\n  const progress = root.querySelector('.progress span');\n  const notesButton = root.querySelector('[data-notes]');\n  const notesPanel = root.querySelector('.notes-panel');\n  let index = 0;\n  function scaleStage(){\n    const s = Math.min((innerWidth-20)/1280,(innerHeight-20)/720);\n    stage.style.transform = 'scale('+Math.max(.2,s)+')';\n  }\n  function show(i){\n    index = Math.max(0,Math.min(slides.length-1,i));\n    slides.forEach((s,n)=>{const active=n===index;s.classList.toggle('active',active);s.setAttribute('aria-hidden',String(!active));});\n    prev.disabled=index===0; next.disabled=index===slides.length-1;\n    counter.textContent=(index+1)+' / '+slides.length;\n    progress.style.width=((index+1)/slides.length*100)+'%';\n    notesPanel.hidden=true;\n  }\n  prev.addEventListener('click',()=>show(index-1));\n  next.addEventListener('click',()=>show(index+1));\n  notesButton.addEventListener('click',()=>{\n    const note=slides[index].querySelector('.speaker-note');\n    notesPanel.innerHTML='\u003cstrong>הערות למעביר\u003c/strong>'+(note?note.innerHTML:'אין הערות לשקופית זו.');\n    notesPanel.hidden=!notesPanel.hidden;\n  });\n  addEventListener('keydown',(e)=>{\n    if(['ArrowRight','PageDown',' '].includes(e.key)){e.preventDefault();show(index+1)}\n    else if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();show(index-1)}\n    else if(e.key==='Home')show(0);else if(e.key==='End')show(slides.length-1);\n    else if(e.key.toLowerCase()==='n')notesButton.click();\n    else if(e.key.toLowerCase()==='a'){root.classList.toggle('motion-on');var mb=root.querySelector('.motion-badge');if(mb)mb.hidden=root.classList.contains('motion-on');root.querySelectorAll('svg').forEach(function(v){if(v.pauseAnimations){root.classList.contains('motion-on')?v.unpauseAnimations():v.pauseAnimations();}});}else if(e.key.toLowerCase()==='f'){if(!document.fullscreenElement)document.documentElement.requestFullscreen?.();else document.exitFullscreen?.()}\n  });\n  \n  addEventListener('resize',scaleStage);scaleStage();show(0);\n})();\n\u003c/script>\u003c/body>\u003c/html>\n","editor/templates/guide-template.html":"\u003c!doctype html>\u003chtml lang=\"he\" dir=\"rtl\">\u003chead>\u003cmeta charset=\"utf-8\">\u003ctitle>שם השיעור\u003c/title>\u003cstyle>\n@page{size:A4;margin:52pt 54pt 46pt 54pt;\n  @bottom-right{content:\"מחלקת תקשוב · מסלול · שיעור 0\";\n    font-family:\"Liberation Sans\",Arial,sans-serif;font-size:8pt;color:#8b9bab;\n    width:100%;text-align:right;vertical-align:top;padding-top:10pt;direction:rtl}\n  @bottom-left{content:counter(page) \" / \" counter(pages);\n    font-family:\"Liberation Sans\",Arial,sans-serif;font-size:8pt;color:#8b9bab;\n    width:100%;text-align:left;vertical-align:top;padding-top:10pt;direction:ltr}}\n@page:first{@bottom-right{content:\"\"}@bottom-left{content:\"\"}}\n*{box-sizing:border-box}\nbody{margin:0;font-family:\"Liberation Sans\",Arial,sans-serif;color:#1b2a38;font-size:10pt;line-height:1.55;direction:rtl}\n.pg{page-break-after:always}\n.pg:last-child{page-break-after:auto}\n.eyebrow{font-size:9pt;font-weight:bold;color:#0f2740;margin-bottom:9pt}\nh1{font-size:20pt;font-weight:bold;margin:0 0 14pt;color:#0f2740;line-height:1.24;text-align:center}\nh2{font-size:13pt;margin:16pt 0 8pt;color:#0f2740;font-weight:bold}\n.rule{border:0;border-top:1px solid #dbe3ea;margin \"eyebrow\">00 · לפני השיעור\u003c/div>\n  \u003ch1>מטרה, הכנה וחלוקת זמן\u003c/h1>\u003chr class=\"rule\">\n  \u003ch2>מטרת השיעור\u003c/h2>\n  \u003cp>מה החניך אמור לדעת ולעשות בסוף השיעור.\u003c/p>\n  \u003ch2>הכנה\u003c/h2>\n  \u003cul>\n    \u003cli>פתחו את המצגת ב-Chrome או ב-Edge במחשב שמחובר למקרן ועברו על כל השקופיות. המצגת לא צריכה חיבור לרשת.\u003c/li>\n    \u003cli>הניווט: חץ ימינה, רווח או \u003cspan class=\"ltr\">PageDown\u003c/span> לשקופית הבאה, חץ שמאלה או \u003cspan class=\"ltr\">PageUp\u003c/span> לקודמת. \u003cspan class=\"ltr\">N\u003c/span> פותח את הערות המדריך, \u003cspan class=\"ltr\">F\u003c/span> מסך מלא, \u003cspan class=\"ltr\">A\u003c/span> מכבה ומדליק את האנימציות.\u003c/li>\n  \u003c/ul>\n  \u003ch2>חלוקת זמן\u003c/h2>\n  \u003ctable>\n    \u003ctr>\u003cth>חלק\u003c/th>\u003cth>שקופיות\u003c/th>\u003cth>מה מעבירים\u003c/th>\u003cth class=\"n\">דקות\u003c/th>\u003c/tr>\n    \u003ctr>\u003ctd class=\"k\">פתיחה\u003c/td>\u003ctd class=\"n\">1\u003c/td>\u003ctd>שאלת פתיחה\u003c/td>\u003ctd class=\"n\">5\u003c/td>\u003c/tr>\n    \u003ctr>\u003ctd class=\"k\">גוף השיעור\u003c/td>\u003ctd class=\"n\">2\u003c/td>\u003ctd>הנושא המרכזי\u003c/td>\u003ctd class=\"n\">30\u003c/td>\u003c/tr>\n    \u003ctr>\u003ctd class=\"k\">סגירה\u003c/td>\u003ctd class=\"n\">3\u003c/td>\u003ctd>סיכום\u003c/td>\u003ctd class=\"n\">10\u003c/td>\u003c/tr>\n  \u003c/table>\n\u003c/div>\n\n\u003c!-- שקופיות -->\n\u003cdiv class=\"pg\">\n  \u003cdiv class=\"eyebrow\">01 · שקופיות \u003cspan class=\"ltr\">1-3\u003c/span>\u003c/div>\n  \u003ch1>כותרת הפרק\u003c/h1>\u003chr class=\"rule\">\n  \u003ch2>שקופית 1 · כותרת השקופית\u003c/h2>\n  \u003cp>\u003cstrong>על המסך:\u003c/strong> מה רואים בשקופית.\u003c/p>\n  \u003cp>\u003cstrong>רקע.\u003c/strong> מה המדריך צריך להבין כדי להסביר את השקופית.\u003c/p>\n  \u003cdiv class=\"note green\">\u003ch3>שאלה לכיתה\u003c/h3>\n    \u003cp>השאלה, ומתי חוזרים לתשובה.\u003c/p>\n  \u003c/div>\n  \u003ch2>שקופית 2 · כותרת השקופית\u003c/     var withIndex = h('input', { type: 'checkbox', checked: !!m });
    var paths = h('pre', { class: 'paths', dir: 'ltr' });
    var err = h('p', { class: 'err' });
    function curTrack() {
      if (trackSel.value === 'new') return { dir: newDir.value.trim(), name: newName.value.trim(), isNew: true };
      var t = tracks.find(function (x) { return String(x.ti) === trackSel.value; });
      return t ? { dir: t.dir || newDir.value.trim(), name: t.name, tr: t.tr, ti: t.ti, needsDir: !t.dir } : null;
    }
    function update() {
      var t = curTrack();
      newTrackBox.hidden = trackSel.value !== 'new';
      dirBox.hidden = !(t && (t.isNew || t.needsDir));
      if (!num.dataset.touched && t && t.tr) num.value = nextNum(t.tr);
      if (!num.dataset.touched && t && t.isNew) num.value = '01';
      if (!footer.dataset.touched) footer.value = 'שיעור ' + (parseInt(num.value, 10) || '') + ' · ' + (title.value || 'שם השיעור');
      var problems = [];
      if (!t || !t.dir) problems.push('צריך שם לתיקיית המסלול.');
      else if (!M.validSlug(t.dir)) problems.push('שם תיקיית המסלול: רק a-z, ספרות ומקפים.');
      if (!/^\d{1,3}$/.test(num.value.trim())) problems.push('מספר השיעור: ספרות בלבד.');
      if (!M.validSlug(slug.value.trim())) problems.push('המזהה באנגלית: אותיות לטיניות קטנות, ספרות ומקפים (הנתיבים בסט נשארים ASCII בגלל IIS).');
      if (!title.value.trim()) problems.push('חסר שם לשיעור.');
      err.textContent = problems.join(' ');
      if (t && t.dir && M.validSlug(slug.value.trim())) {
        var p = M.lessonPaths(t.dir, num.value, slug.value.trim());
        paths.textContent = p.deck + (withGuide.checked ? '\n' + p.guideSource : '');
      } else paths.textContent = '';
      return problems.length === 0;
    }
    [trackSel, newName, newDir, num, slug, title, desc, badge, footer, withGuide].forEach(function (el) { el.addEventListener('input', update); el.addEventListener('change', update); });
    num.addEventListener('input', function () { num.dataset.touched = '1'; });
    footer.addEventListener('input', function () { footer.dataset.touched = '1'; });
    if (opts.trackIndex != null) trackSel.value = String(opts.trackIndex);
    update();
    var body = h('div', { class: 'grid-form' },
      h('label', null, 'מסלול', trackSel), newTrackBox, dirBox,
      h('div', { class: 'two' }, h('label', null, 'מספר', num), h('label', null, 'מזהה באנגלית (לשמות הקבצים)', slug)),
      h('label', null, 'שם השיעור', title),
      h('label', null, 'תיאור לאינדקס', desc),
      h('div', { class: 'two' }, h('label', null, 'תגית בשער המצגת', badge), h('label', null, 'תווית התחתית', footer)),
      h('fieldset', null, h('legend', null, 'מקור המצגת'), srcRadios),
      h('label', { class: 'check' }, withGuide, ' ליצור גם מקור לדף הנחיה בתיקייה ', h('code', null, '.agents/guide-sources/')),
      h('label', { class: 'check' }, withIndex, ' להוסיף שורה לאינדקס (נפתח לבדיקה ולשמירה)'),
      h('div', null, h('b', null, 'קבצים שייווצרו:'), paths, h('p', { class: 'muted small' }, 'את ה-PDF של דף ההנחיה יוצרים אחר כך בהדפסה מהמקור, ושומרים אותו ליד המצגת בשם שמסתיים ב-', h('code', null, '-guide.pdf'), '.')), err);
    var createBtn = btn('יצירת השיעור', async function (e) {
      e.preventDefault();
      if (!update()) return;
      createBtn.disabled = true;
      try { if (await createLesson({ track: curTrack(), newTrackName: newName.value.trim(), newTrackSub: newSub.value.trim(), num: M.pad(parseInt(num.value, 10)), slug: slug.value.trim(), title: title.value.trim(), desc: desc.value.trim(), badge: badge.value.trim(), footer: footer.value.trim(), src: srcKind, dup: dupSel.value, withGuide: withGuide.checked, withIndex: withIndex.checked })) dlg.close(); }
      finally { createBtn.disabled = false; }
    }, 'primary');
    var dlg = dialog('שיעור חדש', body, createBtn);
  }

  /* the single-file build carries the templates inside itself (build-single.cjs) */
  function embeddedTemplate(path) {
    var el = document.getElementById('ib-templates');
    if (!el) return null;
    try { return JSON.parse(el.textContent)[path] || null; } catch (e) { return null; }
  }
  /* the opened folder's template wins; the embedded copy covers a folder without editor/ */
  async function readTemplate(path) {
    try { return await state.fs.readText(path); } catch (e) { return embeddedTemplate(path); }
  }
  async function createLesson(o) {
    var fs = state.fs, t = o.track;
    var p = M.lessonPaths(t.dir, o.num, o.slug);
    if (await fs.dirExists(p.dir) || await fs.exists(p.deck)) { toast('התיקייה ' + p.dir + ' כבר קיימת. בחרו מספר או מזהה אחר.', 'error'); return false; }
    var src;
    if (o.src === 'dup') src = await fs.readText(o.dup);
    else {
      src = await readTemplate('editor/templates/deck-template.html');
      if (!src) { toast('לא מצאתי את editor/templates/deck-template.html בתיקייה. פתחו את שורש המאגר, או בחרו עותק של שיעור קיים.', 'error', 9000); return false; }
    }
    var deckText;
    try { deckText = M.instantiateDeck(src, { title: o.title, subtitle: o.desc || null, badge: o.badge || (t.isNew ? o.newTrackName : t.name) || null, footerLabel: esc(o.footer) }); }
    catch (e) { toast('יצירת המצגת נכשלה: ' + e.message, 'error'); return false; }
    await fs.write(p.deck, deckText);
    var made = [p.deck];
    if (o.withGuide) {
      if (await fs.exists(p.guideSource)) toast('מקור דף ההנחיה ' + p.guideSource + ' כבר קיים; לא דרסתי אותו.', 'warn', 8000);
      else {
        var gsrc = null;
        if (o.src === 'dup') {
          var parts = o.dup.split('/'), nn = (/(\d+)-/.exec(parts[1] || '') || [])[1];
          var cands = M.guideSourceCandidates(parts[0], nn);
          for (var i = 0; i < cands.length && !gsrc; i++) gsrc = await readTemplate(cands[i]);
        }
        if (!gsrc) gsrc = await readTemplate('editor/templates/guide-template.html');
        if (gsrc) {
          var trackName = t.isNew ? o.newTrackName : t.name;
          await fs.write(p.guideSource, M.instantiateGuide(gsrc, { title: o.title, footer: 'מחלקת תקשוב · ' + trackName + ' · שיעור ' + parseInt(o.num, 10), kick: 'מחלקת תקשוב · ' + trackName + ' · מדריך למעביר השיעור' }));
          made.push(p.guideSource);
        } else toast('לא נמצאה תבנית לדף ההנחיה (editor/templates/guide-template.html).', 'warn');
      }
    }
    if (o.withIndex) {
      var idx = await openDoc('index.html', { kind: 'index' });
      if (idx && idx.kind === 'index') {
        change(idx, function () {
          var tr;
          if (t.isNew) { tr = M.newTrack(esc(o.newTrackName || t.dir), esc(o.newTrackSub || 'תיאור קצר של המסלול.')); idx.model.tracks.splice(trackInsertIndex(idx.model), 0, tr); }
          else tr = idx.model.tracks[t.ti];
          insertLessonItem(tr, M.newLessonItem({ num: o.num, title: o.title, desc: o.desc, deck: p.deck, guide: null }));
        });
        toast('נוספה שורה לאינדקס (בלי קישור ל-PDF עד שיודפס). האינדקס עוד לא נשמר.', 'ok', 8000);
      }
    }
    await refreshLibrary(true);
    toast('נוצרו: ' + made.join(', '), 'ok', 8000);
    await openDoc(p.deck, { kind: 'deck' });
    return true;
  }

  function openFileDialog() {
    if (!state.lib) return;
    var filter = h('input', { type: 'search', placeholder: 'סינון…', dir: 'rtl' });
    var list = h('div', { class: 'filelist tall' });
    var files = state.lib.htmlFiles;
    function draw() {
      clear(list);
      var q = filter.value.trim().toLowerCase();
      files.filter(function (p) { return !q || p.toLowerCase().indexOf(q) >= 0; }).forEach(function (p) {
        list.appendChild(btn(p, function () { dlg.close(); openDoc(p); }, 'file'));
      });
    }
    filter.addEventListener('input', draw);
    var dlg = dialog('פתיחת קובץ HTML', h('div', null, filter, list, h('p', { class: 'muted small' }, 'מוצגים קובצי HTML עד עומק 3 תיקיות, בלי tmp, archive, techGame ו-.git. קובץ שאינו מצגת, מקור הנחיה או האינדקס נפתח לעריכת קוד.')), null);
    draw();
    filter.focus();
  }

  async function zipDialog() {
    if (!state.fs) return;
    var top = await state.fs.topLevel();
    var published = { 'index.html': 1, radio: 1, networks: 1, devices: 1, reference: 1 };
    var m = currentIndexModel();
    if (m) M.indexLinks(m).forEach(function (l) { if (M.isLocalHref(l.href)) published[l.href.split('/')[0]] = 1; });
    var never = { '.git': 1, '.editor-backups': 1, 'node_modules': 1 };
    var boxes = [];
    var list = h('div', { class: 'zip-list' }, top.filter(function (e) { return !never[e.name]; }).map(function (e) {
      var cb = h('input', { type: 'checkbox', value: e.name, checked: !!published[e.name] });
      boxes.push(cb);
      return h('label', null, cb, ' ', h('code', null, e.name + (e.kind === 'directory' ? '/' : '')), published[e.name] ? h('span', { class: 'chip ok' }, 'בסט המפורסם') : null, /^(\.agents|\.claude|tmp)$/.test(e.name) ? h('span', { class: 'chip warn' }, 'פנימי, לא לפרסום') : null);
    }));
    var onlyChanged = h('input', { type: 'checkbox' });
    var prog = h('progress', { max: 1, value: 0, hidden: true });
    var go = btn('יצירת ZIP', async function (e) {
      e.preventDefault();
      var picked = boxes.filter(function (b) { return b.checked; }).map(function (b) { return b.value; });
      go.disabled = true; prog.hidden = false;
      try {
        var files = [];
        if (onlyChanged.checked && state.fs.kind === 'memory') files = Array.from(state.fs.changed);
        else for (var i = 0; i < picked.length; i++) {
          var name = picked[i];
          if (await state.fs.exists(name)) files.push(name);
          else (await state.fs.list(name, { skip: never })).forEach(function (x) { files.push(x.path); });
        }
        if (!files.length) { toast('לא נבחרו קבצים.', 'warn'); return; }
        var entries = [];
        for (var k = 0; k < files.length; k++) {
          var f = await state.fs.file(files[k]);
          entries.push({ path: files[k], data: f, date: f.lastModified ? new Date(f.lastModified) : new Date() });
        }
        var blob = await Z.makeZip(entries, { onProgress: function (n, t) { prog.max = t; prog.value = n; } });
        download(blob, (state.fs.name || 'instructbase').replace(/[^\w.-]+/g, '-') + '-' + dateStr() + '.zip');
        toast('נוצר ZIP עם ' + count(files.length, 'קובץ אחד', 'קבצים') + ' (' + fmtBytes(blob.size) + ').', 'ok');
        dlg.close();
      } catch (err) { toast('יצירת ה-ZIP נכשלה: ' + (err && err.message || err), 'error'); }
      finally { go.disabled = false; }
    }, 'primary');
    var dlg = dialog('הורדת ZIP', h('div', null,
      h('p', { class: 'muted' }, 'הקבצים נקראים מהדיסק: שינויים שלא נשמרו לא ייכנסו. התיקיות שמסומנות מראש הן הסט שמתפרסם (מה שהאינדקס מקשר אליו).'),
      list,
      state.fs.kind === 'memory' ? h('label', { class: 'check' }, onlyChanged, ' רק הקבצים ששונו (' + state.fs.changed.size + ')') : null,
      h('p', { class: 'muted small' }, 'עותקים קפואים של החומר לפי תאריך, כולל ZIP מוכן, נמצאים ב-archive/.'),
      prog), go);
  }

  /* ================================================================== */
  /* boot                                                                */
  /* ================================================================== */
  /* PWA: the service worker and app install need a secure origin (https or
     localhost). Opened as a file, the editor still works, but cannot install. */
  var deferredInstall = null;
  function isSecureOrigin() { return location.protocol === 'https:' || /^(localhost|127\.0\.0\.1|\[::1\])$/.test(location.hostname); }
  function setupPwa() {
    if (window.IB_SINGLE || !('serviceWorker' in navigator) || !isSecureOrigin()) return;   // a single file cannot carry a service worker
    navigator.serviceWorker.register('sw.js').catch(function (e) { if (window.console) console.warn('service worker:', e); });
    var b = $('#btn-install');
    window.addEventListener('beforeinstallprompt', function (e) { e.preventDefault(); deferredInstall = e; b.hidden = false; });
    window.addEventListener('appinstalled', function () { deferredInstall = null; b.hidden = true; toast('העורך הותקן כאפליקציה. מעכשיו אפשר לפתוח אותו מתפריט ההתחלה, גם בלי השרת המקומי.', 'ok', 9000); });
    b.addEventListener('click', function () {
      if (!deferredInstall) return;
      deferredInstall.prompt();
      deferredInstall.userChoice.then(function () { deferredInstall = null; b.hidden = true; });
    });
  }
  function boot() {
    setupPwa();
    $('#btn-open').addEventListener('click', pickFolder);
    $('#btn-save').addEventListener('click', function () { saveDoc(activeDoc()); });
    $('#btn-undo').addEventListener('click', function () { undo(activeDoc()); });
    $('#btn-redo').addEventListener('click', function () { redo(activeDoc()); });
    $('#btn-zip').addEventListener('click', zipDialog);
    $('#btn-mem-zip').addEventListener('click', zipDialog);
    var bk = $('#opt-backup');
    bk.checked = pref('backup') !== '0';
    bk.addEventListener('change', function () { pref('backup', bk.checked ? '1' : '0'); });
    $('#fallback-input').addEventListener('change', function (e) { if (e.target.files.length) setFS(F.MemoryFS.fromFileList(e.target.files)); });
    document.addEventListener('keydown', function (e) {
      var mod = e.ctrlKey || e.metaKey;
      if (!mod) return;
      var k = e.key.toLowerCase();
      var inField = e.target && (e.target.isContentEditable || /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName));
      if (k === 's') { e.preventDefault(); if (e.shiftKey) saveAll(); else saveDoc(activeDoc()); }
      else if (!inField && k === 'z' && !e.shiftKey) { e.preventDefault(); undo(activeDoc()); }
      else if (!inField && (k === 'y' || (k === 'z' && e.shiftKey))) { e.preventDefault(); redo(activeDoc()); }
    });
    window.addEventListener('beforeunload', function (e) { if (state.docs.some(function (d) { return d.dirty; })) { e.preventDefault(); e.returnValue = ''; } });
    renderTabs();
    renderHome();
  }

  window.IBApp = {
    state: state,
    openWithHandle: function (dir) { return setFS(new F.HandleFS(dir)); },
    openDoc: openDoc, saveDoc: saveDoc, openSlideEditor: openSlideEditor, serialize: serialize, activeDoc: activeDoc, createLesson: createLesson,
    change: change, gotoUnit: gotoUnit, insertUnit: insertUnit, moveUnit: moveUnit, deleteUnit: deleteUnit, refreshLibrary: refreshLibrary
  };
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();
})();
</script>
</body>
